<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111e">
  <meta name="description" content="Support and privacy information for TV Remote: Wi-Fi Control.">
  <title>TV Remote: Wi-Fi Control</title>
  <style>
    :root { color-scheme: light dark; --bg: #07111e; --card: #121e2c; --text: #f4f8fc; --muted: #a9b7c8; --accent: #18c6ee; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 32px 20px; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 0%, #123b56 0, var(--bg) 62%); color: var(--text); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 720px); padding: clamp(28px, 7vw, 64px); border: 1px solid #284457; border-radius: 32px; background: var(--card); box-shadow: 0 30px 100px #0007; }
    .eyebrow { color: var(--accent); font-size: 13px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 12px 0 8px; font-size: clamp(2rem, 7vw, 3.4rem); line-height: 1.08; }
    p { color: var(--muted); }
    nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 32px; }
    nav a { padding: 17px 20px; border: 1px solid #2c5468; border-radius: 18px; background: #0b1a28; color: var(--text); font-weight: 650; text-align: center; text-decoration: none; }
    nav a:hover, nav a:focus-visible { border-color: var(--accent); outline: 2px solid transparent; }
    footer { margin-top: 28px; color: var(--muted); font-size: 14px; }
    footer a { color: var(--accent); }
    @media (max-width: 480px) { nav { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">TV Remote</div>
    <h1>Help and privacy</h1>
    <p>TV Remote: Wi-Fi Control helps you use your iPhone with compatible televisions on your home Wi-Fi. Read how the app handles information or get help with a connection.</p>
    <nav aria-label="TV Remote information">
      <a href="privacy.html">Privacy Policy</a>
      <a href="support.html">Support</a>
    </nav>
    <footer>Questions? <a href="mailto:malikusman.2131@gmail.com?subject=TV%20Remote%20Support">Email support</a>.</footer>
  </main>
</body>
</html>
